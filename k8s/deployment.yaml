apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingboard
  labels:
    app: pingboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pingboard
  template:
    metadata:
      labels:
        app: pingboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pingboard
          image: pingboard:1.0.0
          # Image is loaded into kind (see NOTES.md), never pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: production
            - name: APP_VERSION
              value: "1.0.0"
            - name: STARTUP_DELAY_SECONDS
              value: "10"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pingboard
                  key: API_TOKEN
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # gunicorn writes worker heartbeat files to /tmp, which must be writable
          # when the root filesystem is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
