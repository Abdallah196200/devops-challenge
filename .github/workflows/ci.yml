name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 app tests
      - name: Test
        run: pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pingboard:ci .
      - name: Smoke test image
        run: |
          docker run -d --name pb -p 8080:8080 -e API_TOKEN=ci-token pingboard:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/checks)" = 401
          curl -fsS -H "Authorization: Bearer ci-token" localhost:8080/api/checks
          docker rm -f pb
